name: Stop Railway API

on:
  schedule:
    - cron: "0 2 * * *"   # 23h Brasil (UTC-3)

jobs:
  stop:
    runs-on: ubuntu-latest

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Stop service
        run: railway service stop
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}