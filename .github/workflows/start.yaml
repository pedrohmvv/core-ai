name: Start Railway API

on:
  schedule:
    - cron: "0 10 * * *"  # 07h Brasil

jobs:
  start:
    runs-on: ubuntu-latest

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Start service
        run: railway service start
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}